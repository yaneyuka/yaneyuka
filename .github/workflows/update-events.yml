name: Update Events

on:
  schedule:
    # 日本時間 月曜 午前5時 (UTC 日曜 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Update event periods
        id: update
        run: |
          node scripts/update-events.mjs | tee /tmp/events.log
          echo '## イベント会期の更新' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/events.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- src/data/events.json; then
            echo "会期に変化なし。コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json
          git commit -m "Update event periods"
          git push

      - name: Keep workflow alive
        uses: actions/github-script@v7
        with:
          script: |
            // 60日間コミットが無いとスケジュールが自動停止するため、毎回有効化し直す
            await github.rest.actions.enableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update-events.yml'
            })
